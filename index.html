<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EoP Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
            font-size: 17px;
        }

        .skills {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .skill-button {
            width: 100%;
            padding: 22px;
            border: none;
            border-radius: 14px;
            background: #242424;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
        }

        .skill-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎮 EoP Calculator</h1>

        <div class="subtitle">
            Choose a skill
        </div>

        <div class="skills">

            <button class="skill-button">
                🌲 Woodcutting
            </button>

            <button class="skill-button">
                🪵 Carving
            </button>

            <button class="skill-button">
                ⛏️ Mining
            </button>

            <button class="skill-button">
                🔥 Forge
            </button>

            <button class="skill-button">
                ⚔️ Combat
            </button>

        </div>

    </div>

</body>
</html>
