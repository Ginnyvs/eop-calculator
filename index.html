<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EoP Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --void: #0b0906;
  --void-2: #060403;
  --panel: #1b140c;
  --panel-2: #241b10;
  --line: #4a3319;
  --line-bright: #6d4c22;
  --gold-dim: #8a6a34;
  --gold: #c9973f;
  --gold-bright: #f2c66d;
  --jade: #3f9d72;
  --jade-bright: #6fd6a1;
  --crimson: #c0483a;
  --ink: #f1e6cc;
  --ink-dim: #a4906c;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  font-family: 'Spectral', Georgia, serif;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, #271c0e 0%, transparent 60%),
    linear-gradient(180deg, var(--void) 0%, var(--void-2) 100%);
  color: var(--ink);
  position: relative;
  overflow-x: hidden;
}

::selection { background: var(--gold-dim); color: var(--void); }

.embers {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.embers span {
  position: absolute;
  bottom: -10px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--gold-bright);
  box-shadow: 0 0 6px 1px var(--gold);
  opacity: 0;
  animation: emberRise linear infinite;
}
.embers span:nth-child(1) { left: 8%;  animation-duration: 9s;  animation-delay: 0s; }
.embers span:nth-child(2) { left: 22%; animation-duration: 12s; animation-delay: 2s; }
.embers span:nth-child(3) { left: 38%; animation-duration: 10s; animation-delay: 4.5s; }
.embers span:nth-child(4) { left: 58%; animation-duration: 13s; animation-delay: 1s; }
.embers span:nth-child(5) { left: 76%; animation-duration: 9.5s; animation-delay: 3.5s; }
.embers span:nth-child(6) { left: 90%; animation-duration: 11.5s; animation-delay: 5.5s; }
@keyframes emberRise {
  0%   { transform: translateY(0) translateX(0);     opacity: 0; }
  10%  { opacity: .7; }
  85%  { opacity: .25; }
  100% { transform: translateY(-100vh) translateX(12px); opacity: 0; }
}

.container {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 28px 18px 32px;
  position: relative;
  z-index: 1;
}

.eyebrow {
  text-align: center;
  font-family: 'Spectral', serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin: 0 0 4px;
}
h1 {
  text-align: center;
  font-family: 'Cinzel', Georgia, serif;
  font-weight: 700;
  font-size: 25px;
  letter-spacing: 0.5px;
  color: var(--gold-bright);
  text-shadow: 0 0 18px rgba(242, 198, 109, 0.25);
  margin: 0;
}
h2 {
  text-align: center;
  font-family: 'Spectral', serif;
  font-style: italic;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.5px;
  color: var(--ink-dim);
  margin: 0 0 28px;
}
.crest-divider {
  width: 90px;
  height: 1px;
  margin: 14px auto 16px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold-bright), var(--gold-dim), transparent);
  position: relative;
}
.crest-divider::before {
  content: "◆";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 8px;
  color: var(--gold-bright);
  background: var(--void);
  padding: 0 6px;
}
.crest-divider.small { width: 60px; margin: 10px auto 0; }

.screen { display: none; }
.screen.active {
  display: block;
  animation: riseIn .5s ease both;
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Home ---------- */
.skills {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 8px;
}
.skill-button {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px 8px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(160deg, rgba(36,27,16,0.32), rgba(27,20,12,0.32));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  cursor: pointer;
  font-family: inherit;
  animation: riseIn .5s ease both;
}
.skill-button::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid var(--line-bright);
  border-radius: 10px;
  opacity: 0.55;
  pointer-events: none;
}
.skills .skill-button:nth-child(1) { animation-delay: .04s; }
.skills .skill-button:nth-child(2) { animation-delay: .09s; }
.skills .skill-button:nth-child(3) { animation-delay: .14s; }
.skills .skill-button:nth-child(4) { animation-delay: .19s; }
.skills .skill-button:nth-child(5) { animation-delay: .24s; }
.skill-button:active {
  transform: scale(0.97);
}
.skill-button:active .skill-icon {
  box-shadow: 0 0 0 1px var(--gold-bright), 0 0 16px rgba(242, 198, 109, 0.45);
}
.skill-button:last-child {
  grid-column: 1 / -1;
  width: 55%;
  margin: 0 auto;
}
.skill-icon {
  position: relative;
  overflow: hidden;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 19px;
  background: radial-gradient(circle at 35% 30%, #2c2013, #150f09);
  border: 1px solid var(--gold-dim);
  box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 0 0 4px var(--void), 0 0 0 5px var(--line),
    -1px 0 0 6px rgba(224, 90, 90, 0.16), 1px 0 0 6px rgba(90, 150, 224, 0.16), 0 1px 0 6px rgba(110, 224, 140, 0.14);
}
.skill-icon::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -30%;
  width: 40%;
  height: 200%;
  background: linear-gradient(120deg, transparent, rgba(242, 198, 109, 0.55), transparent);
  transform: rotate(20deg);
  animation: shimmerSweep 3.2s ease-in-out infinite;
}
@keyframes shimmerSweep {
  0%   { left: -30%; }
  45%  { left: 120%; }
  100% { left: 120%; }
}
.skill-name {
  font-family: 'Cinzel', Georgia, serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gold-bright);
  text-align: center;
}

/* ---------- Calculator ---------- */
.calc-topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.icon-back {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line-bright);
  background: var(--panel);
  color: var(--ink-dim);
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-back:active { border-color: var(--gold); color: var(--gold-bright); }
.calc-heading { flex: 1; }
.calc-heading h1 { font-size: 20px; }

.form-section {
  position: relative;
  background: linear-gradient(160deg, rgba(36,27,16,0.32), rgba(27,20,12,0.32));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.35);
  padding: 18px;
}
.form-section::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid var(--line-bright);
  border-radius: 12px;
  opacity: 0.5;
  pointer-events: none;
}

label {
  display: block;
  margin: 14px 0 6px;
  font-family: 'Cinzel', Georgia, serif;
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gold);
}
label:first-of-type { margin-top: 0; }

input, select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--void);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
}
select {
  appearance: none;
  -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
  background-position: calc(100% - 18px) center, calc(100% - 13px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 32px;
}
input::placeholder { color: var(--ink-dim); font-family: 'Spectral', serif; font-style: italic; }
input:focus, select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(201, 151, 63, 0.2);
}

.bonus-buttons {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.bonus-button {
  flex: 1;
  min-width: 120px;
  padding: 9px 8px;
  border: 1px solid var(--gold-dim);
  border-radius: 3px;
  background: transparent;
  color: var(--gold);
  font-family: 'Cinzel', Georgia, serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
}
.bonus-button:active { transform: scale(0.98); }
.bonus-button.active-boost {
  background: var(--gold);
  border-color: var(--gold);
  color: var(--void);
  box-shadow: 0 0 12px rgba(201, 151, 63, 0.4);
}
.bonus-button.boost50-button {
  animation: rgbText 5s linear infinite;
}
@keyframes rgbText {
  0%   { color: #e05a5a; }
  33%  { color: #5a96e0; }
  66%  { color: #6ee08c; }
  100% { color: #e05a5a; }
}
.bonus-button.totem-button {
  border-color: var(--jade);
  color: #f4f1e8;
  animation: whiteTextPulse 3s ease-in-out infinite;
}
@keyframes whiteTextPulse {
  0%, 100% { text-shadow: 0 0 4px rgba(255, 255, 255, 0.25); }
  50%      { text-shadow: 0 0 10px rgba(255, 255, 255, 0.85); }
}
.bonus-button.totem-button.active-boost {
  background: var(--jade);
  border-color: var(--jade);
  color: var(--void);
  box-shadow: 0 0 12px rgba(63, 157, 114, 0.45);
}

.materials-section { display: none; margin-top: 4px; }
.materials-section.show { display: block; }

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-family: 'Spectral', serif;
  font-size: 13px;
  font-weight: normal;
  text-transform: none;
  color: var(--ink-dim);
  letter-spacing: 0;
}
.checkbox-row input { width: auto; accent-color: var(--gold); }

.calculate-button {
  position: relative;
  width: 100%;
  margin-top: 20px;
  padding: 13px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  background: transparent;
  color: var(--gold-bright);
  font-family: 'Cinzel', Georgia, serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.calculate-button::after {
  content: "";
  position: absolute;
  top: -50%;
  left: -30%;
  width: 40%;
  height: 200%;
  background: linear-gradient(120deg, transparent, rgba(242, 198, 109, 0.4), transparent);
  transform: rotate(20deg);
  animation: shimmerSweep 3s ease-in-out infinite;
}
.calc-diamond {
  font-size: 8px;
  color: var(--gold);
}
.calculate-button:active { transform: scale(0.98); }

.result {
  display: none;
  margin-top: 16px;
  padding: 16px 18px;
  position: relative;
  background: linear-gradient(160deg, rgba(36,27,16,0.32), rgba(27,20,12,0.32));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.35);
}
.result::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px solid var(--line-bright);
  border-radius: 12px;
  opacity: 0.5;
  pointer-events: none;
}
.result.show { display: block; animation: riseIn .4s ease both; }
.result p {
  margin: 0 0 10px;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--ink-dim);
  font-family: 'Cinzel', Georgia, serif;
  font-weight: 600;
}
.result p:last-child { margin-bottom: 0; }
.result strong {
  display: block;
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: var(--gold-bright);
}
.result p.result-hero strong {
  font-size: 24px;
  font-weight: 600;
  text-shadow: 0 0 16px rgba(242, 198, 109, 0.3);
}
.materials-needed-row { display: none; }
.materials-needed-row.show { display: block; }
#forgeCombinedList { font-family: 'JetBrains Mono', monospace; color: var(--gold-bright); }

.error {
  display: block;
  margin-top: 4px;
  color: var(--crimson);
  font-family: 'Spectral', serif;
  font-style: italic;
  font-weight: 600;
  text-transform: none;
  font-size: 14px;
}

@media (prefers-reduced-motion: reduce) {
  .embers { display: none; }
  .screen.active, .skill-button, .result.show, .skill-icon::after, .calculate-button::after, .boost50-button, .totem-button { animation: none; }
}

.footer-credit {
  text-align: center;
  margin-top: 28px;
  font-size: 9px;
  color: var(--ink-dim);
  opacity: 0.4;
  line-height: 1.6;
}
.footer-credit a {
  color: inherit;
  text-decoration: underline;
}
.credit-name {
  color: var(--gold-dim);
  font-style: italic;
  }
  
</style>
</head>
<body>

<div class="embers" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div class="container">

  <div id="home" class="screen active">
    <div class="eyebrow">Empire of Praxia</div>
    <h1>EoP Calculator</h1>
    <div class="crest-divider"></div>
    <h2>Choose your skill</h2>
    <div class="skills">
      <button class="skill-button" onclick="openSkill('Woodcutting')">
        <span class="skill-icon">🌲</span><span class="skill-name">Woodcutting</span>
      </button>
      <button class="skill-button" onclick="openSkill('Carving')">
        <span class="skill-icon">🪵</span><span class="skill-name">Totem Carving</span>
      </button>
      <button class="skill-button" onclick="openSkill('Mining')">
        <span class="skill-icon">⛏️</span><span class="skill-name">Mining</span>
      </button>
      <button class="skill-button" onclick="openSkill('Forge')">
        <span class="skill-icon">🔥</span><span class="skill-name">Forging</span>
      </button>
      <button class="skill-button" onclick="openSkill('Combat')">
        <span class="skill-icon">⚔️</span><span class="skill-name">Combat</span>
      </button>
    </div>

<div class="footer-credit">
  check <a href="https://empireofpraxia.miraheze.org/wiki/Home_Page" target="_blank" rel="noopener">Wiki</a>
  · Made by <span class="credit-name">Ginny</span>
  · Thanks to <span class="credit-name">Poste</span> for the help
</div>
    
  </div>

  <div id="calculator" class="screen">
    <div class="calc-topbar">
      <button type="button" class="icon-back" onclick="goHome()" aria-label="Back">←</button>
      <div class="calc-heading">
        <h1 id="skillTitle">Skill</h1>
      </div>
    </div>
    <div class="crest-divider small"></div>

    <div class="form-section">
      <label for="currentLevel">Current Level</label>
      <input type="number" id="currentLevel" min="1" max="140"
        placeholder="Enter your current level"
        oninput="clampLevel(this); fillMaterials(currentSkillName)">

      <label for="targetLevel">Target Level</label>
      <input type="number" id="targetLevel" min="1" max="140"
        placeholder="Enter your target level"
        oninput="clampLevel(this)">

      <label for="currentXP">Current XP</label>
      <input type="number" id="currentXP" min="0"
        placeholder="Enter your current XP" value="0">

      <div class="bonus-buttons">
        <button type="button" class="bonus-button boost50-button" onclick="setXPBoost(0.5, this)">⭐ +50% XP</button>
        <button type="button" id="totemBoostButton" class="bonus-button totem-button" style="display: none;" onclick="setXPBoost(0.1, this)"> Exp Totem +10% XP</button>
      </div>

      <div id="materialsSection" class="materials-section">
        <label for="material" id="materialLabel">Material</label>
        <select id="material" onchange="onMaterialChange()">
          <option value="">None (optional)</option>
        </select>

        <div id="forgeCraftSection" class="materials-section">
          <label for="forgeCraft">Equipment</label>
          <select id="forgeCraft" onchange="onForgeCraftChange()">
            <option value="">None (just the bar)</option>
          </select>

          <label class="checkbox-row">
            <input type="checkbox" id="equipmentOnly" onchange="onEquipmentOnlyChange()">
            Equipment Only
          </label>
        </div>
      </div>

      <button class="calculate-button" onclick="calculateXP()"><span class="calc-diamond">◆</span>Calculate<span class="calc-diamond">◆</span></button>
    </div>

    <div id="result" class="result">
      <p>XP required for target level<strong id="targetXP">-</strong></p>
      <p class="result-hero">XP remaining<strong id="remainingXP">-</strong></p>
      <p id="materialsNeededRow" class="materials-needed-row">
        Material needed<strong id="materialsNeeded">-</strong>
      </p>
      <p id="producesRow" class="materials-needed-row">
        Produces<strong id="producesAmount">-</strong>
      </p>
      <div id="forgeCombinedRow" class="materials-needed-row">
        <p style="margin-bottom: 6px;">Bars + Equipment</p>
        <p id="forgeCombinedList" style="margin: 0;">-</p>
      </div>
    </div>
  </div>
</div>

<script>
function getXP(level) {
  return Math.floor(100 * Math.pow(1.14, level - 1));
}

function clampLevel(input) {
  if (Number(input.value) > 140) {
    input.value = 140;
  }
}


const materials = {
  Woodcutting: [
    { name: "Birch", minLevel: 1, xp: 10 },
    { name: "Maple", minLevel: 10, xp: 35 },
    { name: "Oak", minLevel: 20, xp: 120 },
    { name: "Cypress", minLevel: 30, xp: 350 },
    { name: "Pine", minLevel: 40, xp: 575 },
    { name: "Fir", minLevel: 50, xp: 875 }
  ],

  Carving: [
    {      name: "Damage Totem", minLevel: 1, xp: 10, yields: 3,
      requires: [{ name: "Birch Log", amount: 1 }]
    },
{ name: "Critical Totem", minLevel: 10, xp: 35, yields: 3,
requires: [{ name: "Maple Log", amount: 1}]
},
{  name: "Experience Totem", minLevel: 20, xp:120, yields: 3,
requires: [{ name: "Oak Log", amount: 1 }]
},
{ name: "Evasion Totem", minLevel: 30, xp: 350,yields: 3,
requires: [{ name: "Cypress Log", amount: 1}]
},
{name: "Earth Totem", minLevel: 40, xp: 575, yields: 3,
 requires: [{ name: "Pine Log", amount: 1}]
},
{name: "Light Totem", minLevel: 50, xp: 1100,
requires: [{name: "Fir Log", amount: 1}]}
  ],

  Mining: [
    { name: "Copper Ore", minLevel: 1, xp: 10 },
    { name: "Tin Ore", minLevel: 10, xp: 35 },
    { name: "Iron Ore", minLevel: 20, xp: 120 },
    { name: "Silver Ore", minLevel: 30, xp: 300 },
    { name: "Gold Ore", minLevel: 40, xp: 550 },
    { name: "Titanium Ore", minLevel: 50, xp: 750 }
  ],

  Forge: {
    bars: [
      { name: "Bronze Bar", minLevel: 1, xp: 30,
        requires: [{ name: "Copper Ore", amount: 7 }, { name: "Tin Ore", amount: 2 }] },
      { name: "Iron Bar", minLevel: 15, xp: 100,
        requires: [{ name: "Iron Ore", amount: 6 }] },
      { name: "Silver Bar", minLevel: 25, xp: 250,
        requires: [{ name: "Silver Ore", amount: 6 }, { name: "Iron Ore", amount: 3 }] },
      { name: "Gold Bar", minLevel: 35, xp: 600,
        requires: [{ name: "Gold Ore", amount: 10 }] },
      { name: "Titanium Bar", minLevel: 45, xp: 950,
        requires: [{ name: "Titanium Ore", amount: 8 }] },
    ],
    equipment: [
 { name: "Bronze Ring", minLevel: 4, xp: 240,
requires: [{ name: "Bronze Bar", amount: 8 }]
},
{ name: "Bronze Boots", minLevel: 5, xp: 300,
requires: [{ name: "Bronze Bar", amount: 10 }]
},
  { name: "Bronze Sword", minLevel: 6, xp: 360,
        requires: [{ name: "Birch Log", amount: 1 }, { name: "Bronze Bar", amount: 12 }] },
{ name: "Bronze Leggings", minLevel: 7, xp: 480,
requires: [{ name: "Bronze Bar", amount: 16 }]},

const forgeLookup = {};
materials.Forge.bars.forEach((bar) => {
  forgeLookup[bar.name] = bar;
});

const skillDisplayNames = {
  Carving: "Totem Carving",
  Forge: "Forging"
};

let currentSkillName = "";
let xpBoost = 0;

function setXPBoost(percentage, button) {
  const allBoostButtons = document.querySelectorAll(".bonus-button");
  if (xpBoost === percentage) {
    xpBoost = 0;
    button.classList.remove("active-boost");
  } else {
    xpBoost = percentage;
    allBoostButtons.forEach((btn) => btn.classList.remove("active-boost"));
    button.classList.add("active-boost");
  }
  const result = document.getElementById("result");
  if (result.classList.contains("show")) {
    calculateXP();
  }
}

function fillMaterials(skill) {
  currentSkillName = skill;
  const section = document.getElementById("materialsSection");
  const select = document.getElementById("material");
  const label = document.getElementById("materialLabel");
  const totemButton = document.getElementById("totemBoostButton");
  totemButton.style.display = (skill === "Combat") ? "" : "none";
  const labels = {
    Combat: "Mob",
    Forge: "Bar",
    Woodcutting: "Tree",
    Mining: "Ore",
    Carving: "Logs"
  };
  label.textContent = labels[skill] || "Material";

  const currentLevelValue = Number(document.getElementById("currentLevel").value) || 0;
  const noneLabels = { Woodcutting: "None", Carving: "None", Mining: "None" };
select.innerHTML = '<option value="">' + (noneLabels[skill] || "None (optional)") + '</option>';

const list = (skill === "Forge") ? materials.Forge.bars : materials[skill];

  if (list) {
    section.classList.add("show");
    list.forEach((mat, index) => {
      if (skill !== "Combat" && mat.minLevel > currentLevelValue) return;
      if (mat.xp == null && !mat.dropOnly) return;
      const option = document.createElement("option");
      option.value = index;
      option.textContent = mat.name;
      select.appendChild(option);
    });
  } else {
    section.classList.remove("show");
  }

  if (skill === "Forge") {
    fillForgeCrafts();
  } else {
    document.getElementById("forgeCraftSection").classList.remove("show");
  }
}

function onEquipmentOnlyChange() {
  if (document.getElementById("result").classList.contains("show")) {
    calculateXP();
  }
}

function onMaterialChange() {
  if (currentSkillName === "Forge") {
    fillForgeCrafts();
  }
  if (document.getElementById("result").classList.contains("show")) {
    calculateXP();
  }
}

function onForgeCraftChange() {
  if (document.getElementById("result").classList.contains("show")) {
    calculateXP();
  }
}

function fillForgeCrafts() {
  const section = document.getElementById("forgeCraftSection");
  const select = document.getElementById("forgeCraft");
  select.innerHTML = '<option value="">None (just the bar)</option>';

  const barIndex = document.getElementById("material").value;
  if (barIndex === "") {
    section.classList.remove("show");
    return;
  }

  const bar = materials.Forge.bars[Number(barIndex)];
  const currentLevelValue = Number(document.getElementById("currentLevel").value) || 0;

  materials.Forge.equipment.forEach((item, index) => {
    if (item.minLevel > currentLevelValue) return;
    if (item.xp == null) return;
    const usesThisBar = item.requires && item.requires.some((req) => req.name === bar.name);
    if (!usesThisBar) return;
    const option = document.createElement("option");
    option.value = index;
    option.textContent = item.name;
    select.appendChild(option);
  });

  section.classList.add("show");
}

function resetBoost() {
  xpBoost = 0;
  document.querySelectorAll(".bonus-button").forEach((btn) => btn.classList.remove("active-boost"));
}

function resetForm() {
  document.getElementById("currentLevel").value = "";
  document.getElementById("targetLevel").value = "";
  document.getElementById("currentXP").value = "";
  document.getElementById("equipmentOnly").checked = false;
  resetBoost();
  document.getElementById("result").classList.remove("show");
}

function openSkill(skill) {
  document.getElementById("home").classList.remove("active");
  document.getElementById("calculator").classList.add("active");
  document.getElementById("skillTitle").textContent = skillDisplayNames[skill] || skill;
  resetForm();
  fillMaterials(skill);
}

function resolveSelectedMaterial(skill, value) {
  if (skill === "Forge") {
    const craftValue = document.getElementById("forgeCraft").value;
    if (craftValue !== "") {
      return materials.Forge.equipment[Number(craftValue)];
    }
    return materials.Forge.bars[Number(value)];
  }
  return materials[skill][Number(value)];
}

function calculateXP() {
  const currentLevel = Number(document.getElementById("currentLevel").value);
  const targetLevel = Number(document.getElementById("targetLevel").value);
  const currentXPInput = document.getElementById("currentXP").value;
  const currentXP = Number(currentXPInput);
  const result = document.getElementById("result");

  if (!currentLevel || !targetLevel || currentXPInput === "" || currentXP < 0) {
    result.classList.add("show");
    document.getElementById("targetXP").innerHTML = '<span class="error">Please fill in all fields.</span>';
    document.getElementById("remainingXP").textContent = "-";
    return;
  }
  if (currentLevel < 1 || currentLevel > 140 || targetLevel < 1 || targetLevel > 140) {
    result.classList.add("show");
    document.getElementById("targetXP").innerHTML = '<span class="error">Levels must be between 1 and 140.</span>';
    document.getElementById("remainingXP").textContent = "-";
    return;
  }
  if (targetLevel <= currentLevel) {
    result.classList.add("show");
    document.getElementById("targetXP").innerHTML = '<span class="error">Target level must be higher than current level.</span>';
    document.getElementById("remainingXP").textContent = "-";
    return;
  }

  let totalXP = 0;
  for (let level = currentLevel; level < targetLevel; level++) {
    totalXP += getXP(level);
}
const remainingXP = Math.max(0, totalXP - currentXP);
  document.getElementById("targetXP").textContent = totalXP.toLocaleString("en-US");

  const materialsNeededRow = document.getElementById("materialsNeededRow");
  const producesRow = document.getElementById("producesRow");
  const forgeCombinedRow = document.getElementById("forgeCombinedRow");
  const rawValue = document.getElementById("material").value;

  if (rawValue === "") {
    document.getElementById("remainingXP").textContent = remainingXP.toLocaleString("en-US");
    materialsNeededRow.classList.remove("show");
    producesRow.classList.remove("show");
    forgeCombinedRow.classList.remove("show");
    result.classList.add("show");
    return;
  }

  const mat = resolveSelectedMaterial(currentSkillName, rawValue);
  const equipmentOnlyChecked = (currentSkillName === "Forge") && document.getElementById("equipmentOnly").checked;
  const forgeCraftValue = (currentSkillName === "Forge") ? document.getElementById("forgeCraft").value : "";
  const isForgeCraft = currentSkillName === "Forge" && forgeCraftValue !== "" && mat.requires;

  let barsXPPerCraft = 0;
  if (isForgeCraft) {
    barsXPPerCraft = mat.requires.reduce((sum, req) => {
      const bar = forgeLookup[req.name];
      return sum + (bar ? bar.xp * req.amount : 0);
    }, 0);
  }
const useCombinedXP = isForgeCraft && !equipmentOnlyChecked;
  const boostedXP = (mat.xp + (useCombinedXP ? barsXPPerCraft : 0)) * (1 + xpBoost);
  const qtyNeeded = Math.ceil(remainingXP / boostedXP);

  document.getElementById("remainingXP").textContent =
    remainingXP.toLocaleString("en-US") + " (" + qtyNeeded.toLocaleString("en-US") + "x " + mat.name + ")";

  if (mat.requires) {
    const rawLines = mat.requires.map((req) => {
      const rawNeeded = qtyNeeded * req.amount;
      return rawNeeded.toLocaleString("en-US") + "x " + req.name;
    });
    document.getElementById("materialsNeeded").textContent = rawLines.join(", ");
    materialsNeededRow.classList.add("show");
  } else {
    materialsNeededRow.classList.remove("show");
  }

if (mat.yields) {
    const totalProduced = qtyNeeded * mat.yields;
    document.getElementById("producesAmount").textContent = totalProduced.toLocaleString("en-US") + "x " + mat.name;
    producesRow.classList.add("show");
  } else {
    producesRow.classList.remove("show");
  }

  if (useCombinedXP) {
    const lines = [mat.name + ": " + qtyNeeded.toLocaleString("en-US")];

    const oreTotals = {};
    mat.requires.forEach((req) => {
      const bar = forgeLookup[req.name];
      const barsNeeded = qtyNeeded * req.amount;
      lines.push(req.name + ": " + barsNeeded.toLocaleString("en-US"));
      if (bar && bar.requires) {
        bar.requires.forEach((oreReq) => {
          const oreNeeded = barsNeeded * oreReq.amount;
          oreTotals[oreReq.name] = (oreTotals[oreReq.name] || 0) + oreNeeded;
        });
      }
});
    Object.keys(oreTotals).forEach((name) => {
      lines.push(name + ": " + oreTotals[name].toLocaleString("en-US"));
    });

    document.getElementById("forgeCombinedList").innerHTML = lines.join("<br>");
    forgeCombinedRow.classList.add("show");
  } else {
    forgeCombinedRow.classList.remove("show");
  }

  result.classList.add("show");
}

function goHome() {
  document.getElementById("calculator").classList.remove("active");
  document.getElementById("home").classList.add("active");
}
