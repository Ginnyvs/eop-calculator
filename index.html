<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EoP Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 30px 20px 40px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin: 10px 0 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .skills {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 35px;
        }

        .skill-button {
            width: 100%;
            padding: 24px 20px;
            border: 1px solid #444;
            border-radius: 14px;
            background: #222;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
        }

        .skill-button:active {
            transform: scale(0.98);
        }

        .form-section {
            background: #1d1d1d;
            padding: 20px;
            border-radius: 14px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #555;
            background: #111;
            color: white;
            font-size: 16px;
        }

        button {
            font-family: inherit;
        }

        .calculate-button {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #2d7d46;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            background: #202020;
            border: 1px solid #444;
        }

        .result.show {
            display: block;
        }

        .result p {
            margin: 12px 0;
            font-size: 18px;
        }

        .result strong {
            font-size: 20px;
        }

        .error {
            color: #ff7777;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="home" class="screen active">

        <h1>🎮 EoP Calculator</h1>

        <h2>Choose a skill</h2>

        <div class="skills">

            <button class="skill-button" onclick="openSkill('Woodcutting')">
                🌲 Woodcutting
            </button>

            <button class="skill-button" onclick="openSkill('Carving')">
                🪵 Carving
            </button>

            <button class="skill-button" onclick="openSkill('Mining')">
                ⛏️ Mining
            </button>

            <button class="skill-button" onclick="openSkill('Forge')">
                🔥 Forge
            </button>

            <button class="skill-button" onclick="openSkill('Combat')">
                ⚔️ Combat
            </button>

        </div>

    </div>


    <!-- CALCULATOR -->
    <div id="calculator" class="screen">

        <h1 id="skillTitle">Skill</h1>

        <div class="form-section">

            <label for="currentLevel">
                Current Level
            </label>

            <select id="currentLevel">
                <option value="">Select level</option>
            </select>


            <label for="targetLevel">
                Target Level
            </label>

            <select id="targetLevel">
                <option value="">Select level</option>
            </select>


            <label for="currentXP">
                Current XP
            </label>

            <input
                type="number"
                id="currentXP"
                min="0"
                placeholder="Enter your current XP"
            >


            <button
                class="calculate-button"
                onclick="calculateXP()"
            >
                CALCULATE
            </button>

        </div>


        <!-- RESULT -->
        <div id="result" class="result">

            <p>
                XP required for target level:
                <br>
                <strong id="targetXP">-</strong>
            </p>

            <p>
                XP remaining:
                <br>
                <strong id="remainingXP">-</strong>
            </p>

        </div>


        <button
            class="back-button"
            onclick="goHome()"
        >
            ← Back
        </button>

    </div>

</div>


<script>

    /*
        EoP XP FORMULA

        XP = floor(100 × 1.14^(level - 1))

        The formula can calculate levels
        from 1 to 140 without storing
        every XP value individually.
    */

    function getXP(level) {

        return Math.floor(
            100 * Math.pow(1.14, level - 1)
        );

    }


    /*
        CREATE LEVEL OPTIONS
        Levels 1 through 140
    */

    function fillLevels() {

        const currentLevel =
            document.getElementById("currentLevel");

        const targetLevel =
            document.getElementById("targetLevel");


        for (let level = 1; level <= 140; level++) {

            const optionCurrent =
                document.createElement("option");

            optionCurrent.value = level;

            optionCurrent.textContent =
                "Level " + level;

            currentLevel.appendChild(optionCurrent);


            const optionTarget =
                document.createElement("option");

            optionTarget.value = level;

            optionTarget.textContent =
                "Level " + level;

            targetLevel.appendChild(optionTarget);

        }

    }


    /*
        OPEN SKILL
    */

    function openSkill(skill) {

        document
            .getElementById("home")
            .classList.remove("active");

        document
            .getElementById("calculator")
            .classList.add("active");

        document
            .getElementById("skillTitle")
            .textContent = skill;

        document
            .getElementById("result")
            .classList.remove("show");

    }


    /*
        CALCULATE XP
    */

    function calculateXP() {

        const currentLevel =
            Number(
                document.getElementById("currentLevel").value
            );

        const targetLevel =
            Number(
                document.getElementById("targetLevel").value
            );

        const currentXP =
            Number(
                document.getElementById("currentXP").value
            );


        const result =
            document.getElementById("result");


        /*
            CHECK INPUTS
        */

        if (!currentLevel ||
            !targetLevel ||
            currentXP < 0) {

            result.classList.add("show");

            document.getElementById("targetXP").innerHTML =
                '<span class="error">Please fill in all fields.</span>';

            document.getElementById("remainingXP").textContent =
                "-";

            return;
        }


        if (targetLevel <= currentLevel) {

            result.classList.add("show");

            document.getElementById("targetXP").innerHTML =
                '<span class="error">Target level must be higher than current level.</span>';

            document.getElementById("remainingXP").textContent =
                "-";

            return;
        }


        /*
            GET XP REQUIRED FOR TARGET LEVEL
        */

        const targetXP =
            getXP(targetLevel);


        /*
            XP STILL NEEDED
        */

        const remainingXP =
            Math.max(0, targetXP - currentXP);


        /*
            SHOW RESULTS
        */

        document.getElementById("targetXP")
            .textContent =
            targetXP.toLocaleString("en-US");


        document.getElementById("remainingXP")
            .textContent =
            remainingXP.toLocaleString("en-US");


        result.classList.add("show");

    }


    /*
        BACK TO HOME
    */

    function goHome() {

        document
            .getElementById("calculator")
            .classList.remove("active");

        document
            .getElementById("home")
            .classList.add("active");

    }


    /*
        START
    */

    fillLevels();

</script>

</body>
</html>
