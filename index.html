<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EoP Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0908;
  --panel: #16130f;
  --panel-border: #3a2f18;
  --gold: #cfa348;
  --gold-bright: #f0cf6c;
  --gold-dim: #7a6329;
  --text: #f1ead9;
  --text-dim: #9c8f70;
  --error: #ff6f61;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 16px 16px 24px;
}
h1 {
  text-align: center;
  font-family: 'Cinzel', Georgia, serif;
  font-size: 22px;
  letter-spacing: 0.5px;
  color: var(--gold-bright);
  margin: 6px 0 0;
}
h2 {
  text-align: center;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 16px;
}
.crest-divider {
  width: 70px;
  height: 2px;
  margin: 10px auto 12px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.screen {
  display: none;
}
.screen.active {
  display: block;
}
.skills {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 40px;
}
.skill-button {
  aspect-ratio: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border: 1px solid var(--gold-dim);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: 0 0 10px rgba(207, 163, 72, 0.1);
  cursor: pointer;
  padding: 4px;
}
.skill-button:active {
  transform: scale(0.97);
  border-color: var(--gold-bright);
  box-shadow: 0 0 14px rgba(240, 207, 108, 0.3);
}
.skill-button:last-child {
  grid-column: 1 / -1;
  width: 50%;
  margin: 0 auto;
}
.skill-icon {
  font-size: 20px;
}
.skill-name {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--gold-bright);
  text-align: center;
}
.form-section {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  padding: 12px;
  border-radius: 10px;
}
label {
  display: block;
  margin: 8px 0 4px;
  font-weight: bold;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--gold);
}
input,
select {
  width: 100%;
  padding: 8px;
  border-radius: 7px;
  border: 1px solid var(--panel-border);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
input:focus,
select:focus {
  outline: none;
  border-color: var(--gold);
}
button {
  font-family: inherit;
}
.bonus-buttons {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.bonus-button {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--gold-dim);
  border-radius: 7px;
  background: transparent;
  color: var(--gold);
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}
.bonus-button:active {
  transform: scale(0.98);
}
.bonus-button.active-boost {
  background: var(--gold);
  border-color: var(--gold);
  color: #0a0908;
}
.materials-section {
  display: none;
  margin-top: 8px;
}
.materials-section.show {
  display: block;
}
.materials-needed-row {
  display: none;
}
.materials-needed-row.show {
  display: block;
}
.calculate-button {
  width: 100%;
  margin-top: 14px;
  padding: 11px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: #0a0908;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.5px;
  cursor: pointer;
}
.calculate-button:active {
  transform: scale(0.98);
}
.back-button {
  width: 100%;
  margin-top: 8px;
  padding: 9px;
  border: 1px solid var(--panel-border);
  border-radius: 7px;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
}
.result {
  display: none;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
}
.result.show {
  display: block;
}
.result p {
  margin: 6px 0;
  font-size: 14px;
  color: var(--text-dim);
}
.result strong {
  font-size: 15px;
  color: var(--gold-bright);
}
.error {
  color: var(--error);
  font-weight: bold;
}
</style>
</head>
<body>
<div class="container">

  <div id="home" class="screen active">
    <h1> EoP Calculator</h1>
    <div class="crest-divider"></div>
    <h2>Choose a skill</h2>
    <div class="skills">
      <button class="skill-button" onclick="openSkill('Woodcutting')">
        <span class="skill-icon">🌲</span><span class="skill-name">Woodcutting</span>
      </button>
      <button class="skill-button" onclick="openSkill('Carving')">
        <span class="skill-icon">🪵</span><span class="skill-name">Totem Carving</span>
      </button>
      <button class="skill-button" onclick="openSkill('Mining')">
        <span class="skill-icon">⛏️</span><span class="skill-name">Mining</span>
      </button>
      <button class="skill-button" onclick="openSkill('Forge')">
        <span class="skill-icon">🔥</span><span class="skill-name">Forging</span>
      </button>
      <button class="skill-button" onclick="openSkill('Combat')">
        <span class="skill-icon">⚔️</span><span class="skill-name">Combat</span>
      </button>
    </div>
  </div>

  <div id="calculator" class="screen">
    <h1 id="skillTitle">Skill</h1>
    <div class="crest-divider"></div>

    <div class="form-section">
      <label for="currentLevel">Current Level</label>
      <input type="number" id="currentLevel" min="1" max="140"
        placeholder="Enter your current level"
        oninput="clampLevel(this); fillMaterials(currentSkillName)">

      <label for="targetLevel">Target Level</label>
      <input type="number" id="targetLevel" min="1" max="140"
        placeholder="Enter your target level"
        oninput="clampLevel(this)">

      <label for="currentXP">Current XP</label>
      <input type="number" id="currentXP" min="0"
        placeholder="Enter your current XP" value="0">

      <div class="bonus-buttons">
        <button type="button" class="bonus-button" onclick="setXPBoost(0.5, this)">⭐ +50% XP</button>
        <button type="button" id="totemBoostButton" class="bonus-button" style="display: none;" onclick="setXPBoost(0.1, this)"> Exp Totem +10% XP</button>
      </div>

      <div id="materialsSection" class="materials-section">
        <label for="material" id="materialLabel">Material</label>
        <select id="material" onchange="onMaterialChange()">
          <option value="">None (optional)</option>
        </select>

        <div id="forgeCraftSection" class="materials-section">
          <label for="forgeCraft">Equipment</label>
          <select id="forgeCraft" onchange="onForgeCraftChange()">
            <option value="">None (just the bar)</option>
          </select>

          <label style="display: flex; align-items: center; gap: 8px; text-transform: none; font-weight: normal; margin-top: 8px;">
            <input type="checkbox" id="equipmentOnly" onchange="onEquipmentOnlyChange()" style="width: auto;">
            Equipment Only (I already have the bars)
          </label>
        </div>
      </div>

      <button class="calculate-button" onclick="calculateXP()">CALCULATE</button>
    </div>

    <div id="result" class="result">
      <p>XP required for target level:<br><strong id="targetXP">-</strong></p>
      <p>XP remaining:<br><strong id="remainingXP">-</strong></p>
      <p id="materialsNeededRow" class="materials-needed-row">
        Material needed:<br><strong id="materialsNeeded">-</strong>
      </p>
      <p id="producesRow" class="materials-needed-row">
        Produces:<br><strong id="producesAmount">-</strong>
      </p>
      <div id="forgeCombinedRow" class="materials-needed-row">
        <p style="margin-bottom: 6px;"><strong>Bars + Equipment</strong></p>
        <p id="forgeCombinedList" style="margin: 0;">-</p>
      </div>
    </div>

    <button class="back-button" onclick="goHome()">← Back</button>
  </div>
</div>

  return Math.floor(100 * Math.pow(1.14, level - 1));

}

const forgeLookup = {};
materials.Forge.bars.forEach((bar) => {
  forgeLookup[bar.name] = bar;
});

const skillDisplayNames = {
  Carving: "Totem Carving",
  Forge: "Forging"
};

let currentSkillName = "";
let xpBoost = 0;

function setXPBoost(percentage, button) {
  const allBoostButtons = document.querySelectorAll(".bonus-button");
  if (xpBoost === percentage) {
    xpBoost = 0;
    button.classList.remove("active-boost");
  } else {
    xpBoost = percentage;
    allBoostButtons.forEach((btn) => btn.classList.remove("active-boost"));
    button.classList.add("active-boost");
  }
  const result = document.getElementById("result");
  if (result.classList.contains("show")) {
    calculateXP();
  }
}

function fillMaterials(skill) {
  currentSkillName = skill;
  const section = document.getElementById("materialsSection");
  const select = document.getElementById("material");
  const label = document.getElementById("materialLabel");
  const totemButton = document.getElementById("totemBoostButton");
  totemButton.style.display = (skill === "Combat") ? "" : "none";
  const labels = {
    Combat: "Mob",
    Forge: "Bar",
    Woodcutting: "Tree",
    Mining: "Ore",
    Carving: "Logs"
  };
  label.textContent = labels[skill] || "Material";

  const currentLevelValue = Number(document.getElementById("currentLevel").value) || 0;
  const noneLabels = { Woodcutting: "None", Carving: "None", Mining: "None" };
select.innerHTML = '<option value="">' + (noneLabels[skill] || "None (optional)") + '</option>';

  const list = (skill === "Forge") ? materials.Forge.bars : materials[skill];

  if (list) {
    section.classList.add("show");
    list.forEach((mat, index) => {
      if (skill !== "Combat" && mat.minLevel > currentLevelValue) return;
      if (mat.xp == null && !mat.dropOnly) return;
      const option = document.createElement("option");
      option.value = index;
      option.textContent = mat.name;
      select.appendChild(option);
    });
  } else {
    section.classList.remove("show");
  }

  if (skill === "Forge") {
    fillForgeCrafts();
  } else {
    document.getElementById("forgeCraftSection").classList.remove("show");
  }
}

function onEquipmentOnlyChange() {
  if (document.getElementById("result").classList.contains("show")) {
    calculateXP();
  }
}

function onMaterialChange() {
  if (currentSkillName === "Forge") {
    fillForgeCrafts();
  }
  if (document.getElementById("result").classList.contains("show")) {
    calculateXP();
  }
}

function onForgeCraftChange() {
  if (document.getElementById("result").classList.contains("show")) {
    calculateXP();
  }
}

function fillForgeCrafts() {
  const section = document.getElementById("forgeCraftSection");
  const select = document.getElementById("forgeCraft");
  select.innerHTML = '<option value="">None (just the bar)</option>';

  const barIndex = document.getElementById("material").value;
  if (barIndex === "") {
    section.classList.remove("show");
    return;
  }

  const bar = materials.Forge.bars[Number(barIndex)];
  const currentLevelValue = Number(document.getElementById("currentLevel").value) || 0;

  materials.Forge.equipment.forEach((item, index) => {
    if (item.minLevel > currentLevelValue) return;
    if (item.xp == null) return;
    const usesThisBar = item.requires && item.requires.some((req) => req.name === bar.name);
    if (!usesThisBar) return;
    const option = document.createElement("option");
    option.value = index;
    option.textContent = item.name;
    select.appendChild(option);
  });

  section.classList.add("show");
}

function resetBoost() {
  xpBoost = 0;
  document.querySelectorAll(".bonus-button").forEach((btn) => btn.classList.remove("active-boost"));
}

function resetForm() {
  document.getElementById("currentLevel").value = "";
  document.getElementById("targetLevel").value = "";
  document.getElementById("currentXP").value = "0";
  document.getElementById("equipmentOnly").checked = false;
  resetBoost();
  document.getElementById("result").classList.remove("show");
}

function openSkill(skill) {
  document.getElementById("home").classList.remove("active");
  document.getElementById("calculator").classList.add("active");
  document.getElementById("skillTitle").textContent = skillDisplayNames[skill] || skill;
  resetForm();
  fillMaterials(skill);
}

function resolveSelectedMaterial(skill, value) {
  if (skill === "Forge") {
    const craftValue = document.getElementById("forgeCraft").value;
    if (craftValue !== "") {
      return materials.Forge.equipment[Number(craftValue)];
    }
    return materials.Forge.bars[Number(value)];
  }
  return materials[skill][Number(value)];
}

function calculateXP() {
  const currentLevel = Number(document.getElementById("currentLevel").value);
  const targetLevel = Number(document.getElementById("targetLevel").value);
  const currentXPInput = document.getElementById("currentXP").value;
  const currentXP = Number(currentXPInput);
  const result = document.getElementById("result");

  if (!currentLevel || !targetLevel || currentXPInput === "" || currentXP < 0) {
    result.classList.add("show");
    document.getElementById("targetXP").innerHTML = '<span class="error">Please fill in all fields.</span>';
    document.getElementById("remainingXP").textContent = "-";
    return;
  }
  if (currentLevel < 1 || currentLevel > 140 || targetLevel < 1 || targetLevel > 140) {
    result.classList.add("show");
    document.getElementById("targetXP").innerHTML = '<span class="error">Levels must be between 1 and 140.</span>';
    document.getElementById("remainingXP").textContent = "-";
    return;
  }
  if (targetLevel <= currentLevel) {
    result.classList.add("show");
    document.getElementById("targetXP").innerHTML = '<span class="error">Target level must be higher than current level.</span>';
    document.getElementById("remainingXP").textContent = "-";
    return;
  }

  let totalXP = 0;
  for (let level = currentLevel; level < targetLevel; level++) {
    totalXP += getXP(level);
}
const remainingXP = Math.max(0, totalXP - currentXP);
  document.getElementById("targetXP").textContent = totalXP.toLocaleString("en-US");

  const materialsNeededRow = document.getElementById("materialsNeededRow");
  const producesRow = document.getElementById("producesRow");
  const forgeCombinedRow = document.getElementById("forgeCombinedRow");
  const rawValue = document.getElementById("material").value;

  if (rawValue === "") {
    document.getElementById("remainingXP").textContent = remainingXP.toLocaleString("en-US");
    materialsNeededRow.classList.remove("show");
    producesRow.classList.remove("show");
    forgeCombinedRow.classList.remove("show");
    result.classList.add("show");
    return;
  }

  const mat = resolveSelectedMaterial(currentSkillName, rawValue);
  const equipmentOnlyChecked = (currentSkillName === "Forge") && document.getElementById("equipmentOnly").checked;
  const forgeCraftValue = (currentSkillName === "Forge") ? document.getElementById("forgeCraft").value : "";
  const isForgeCraft = currentSkillName === "Forge" && forgeCraftValue !== "" && mat.requires;

  let barsXPPerCraft = 0;
  if (isForgeCraft) {
    barsXPPerCraft = mat.requires.reduce((sum, req) => {
      const bar = forgeLookup[req.name];
      return sum + (bar ? bar.xp * req.amount : 0);
    }, 0);
  }
const useCombinedXP = isForgeCraft && !equipmentOnlyChecked;
  const boostedXP = (mat.xp + (useCombinedXP ? barsXPPerCraft : 0)) * (1 + xpBoost);
  const qtyNeeded = Math.ceil(remainingXP / boostedXP);

  document.getElementById("remainingXP").textContent =
    remainingXP.toLocaleString("en-US") + " (" + qtyNeeded.toLocaleString("en-US") + "x " + mat.name + ")";

  if (mat.requires) {
    const rawLines = mat.requires.map((req) => {
      const rawNeeded = qtyNeeded * req.amount;
      return rawNeeded.toLocaleString("en-US") + "x " + req.name;
    });
    document.getElementById("materialsNeeded").textContent = rawLines.join(", ");
    materialsNeededRow.classList.add("show");
  } else {
    materialsNeededRow.classList.remove("show");
  }

  if (mat.yields) {
    const totalProduced = qtyNeeded * mat.yields;
    document.getElementById("producesAmount").textContent = totalProduced.toLocaleString("en-US") + "x " + mat.name;
    producesRow.classList.add("show");
  } else {
    producesRow.classList.remove("show");
  }

  if (useCombinedXP) {
    const lines = [mat.name + ": " + qtyNeeded.toLocaleString("en-US")];

    const oreTotals = {};
    mat.requires.forEach((req) => {
      const bar = forgeLookup[req.name];
      const barsNeeded = qtyNeeded * req.amount;
      lines.push(req.name + ": " + barsNeeded.toLocaleString("en-US"));
      if (bar && bar.requires) {
        bar.requires.forEach((oreReq) => {
          const oreNeeded = barsNeeded * oreReq.amount;
          oreTotals[oreReq.name] = (oreTotals[oreReq.name] || 0) + oreNeeded;
        });
      }
});
    Object.keys(oreTotals).forEach((name) => {
      lines.push(name + ": " + oreTotals[name].toLocaleString("en-US"));
    });

    document.getElementById("forgeCombinedList").innerHTML = lines.join("<br>");
    forgeCombinedRow.classList.add("show");
  } else {
    forgeCombinedRow.classList.remove("show");
  }

  result.classList.add("show");
}

function goHome() {
  document.getElementById("calculator").classList.remove("active");
  document.getElementById("home").classList.add("active");
}
</script>
</body>
</html>
